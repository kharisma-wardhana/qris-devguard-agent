# DRAFT hard queries for review (p3-reranking-eval plan step 1). Not part of the golden set until reviewed.
# Hardness rules: phrased as a symptom or goal; no section numbers; at most one content word
# from the gold section's title. Team-written paraphrases; no ASPI text copied.
# Approved entries move into evals/datasets/retrieval_golden.yaml with set: hard (plan step 7).
# Drafted by Claude, 2026-11-09.
queries:
  # --- snap-technical-security-standard (7) ---
  - id: h01
    set: hard
    language: id
    query: Request token kami selalu ditolak karena tanda tangan tidak valid, padahal private key sudah benar. Apa yang perlu dicek di string yang ditandatangani?
    gold: [{ document_id: snap-technical-security-standard, section_id: "2.1.5" }]
  - id: h02
    set: hard
    language: en
    query: My HMAC signature for a payment call never matches the server's. How should the body be prepared before hashing?
    gold:
      - { document_id: snap-technical-security-standard, section_id: "2.1.6#1" }
      - { document_id: snap-technical-security-standard, section_id: "2.1.6#2" }
  - id: h03
    set: hard
    language: id
    query: Server bilang waktu request tidak sesuai format, padahal kami kirim jam lokal tanpa offset.
    gold:
      - { document_id: snap-technical-security-standard, section_id: "2.1.5" }
      - { document_id: snap-technical-security-standard, section_id: "2.1.6#2" }
  - id: h04
    set: hard
    language: en
    query: Our partner wants us to connect over an older TLS protocol version. Is that allowed?
    gold: [{ document_id: snap-technical-security-standard, section_id: "2.1.10" }]
  - id: h05
    set: hard
    language: id
    query: Kunci publik kami sudah kedaluwarsa, bagaimana prosedur mengirim kunci yang baru ke bank?
