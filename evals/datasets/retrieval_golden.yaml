# Labelled retrieval set (p2-knowledge-pipeline spec AC #11; TRD §22.1: 30 queries with gold sections).
# Queries are team-written paraphrases; no ASPI text is copied here. Gold labels name
# (document_id, section_id) as produced by the extractor (bold numbered PDF headings,
# `#n` = numbered sub-item, Markdown heading slugs for synthetic docs), so they survive
# re-chunking. Drafted by Claude; every entry reviewed and approved by Kharisma Wardhana.
# Reused by P3 for reranking evaluation.
