    question: Response code untuk Unauthorized artinya apa dan kapan dikembalikan?
    context: null
    expected_behaviour: answer
    expected_facts:
      - HTTP 401 with case code 00 is "Unauthorized. [reason]", a general unauthorized error.
      - Its listed causes include OAuth failure, client secret verification failure, unknown client, forbidden API access and key not found.
      - Other 401 cases cover an invalid B2B token (01), invalid customer token (02) and token not found (03, 04).
