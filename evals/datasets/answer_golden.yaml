    source_query: q17
    category: retrieval
    language: id
    question: Apa beda alur pembayaran QR CPM dibanding QR MPM?
    context: null
    expected_behaviour: answer
    expected_facts:
      - In QR CPM, a QR is generated with Generate QR CPM (service 59) and then submitted for payment with CPM Payment (service 60).
      - CPM Payment requires the scanned qrContent (CPM QR string), partnerReferenceNo and merchantId.
      - In QR MPM, Generate QR MPM (service 47) returns the QR content, and payment goes through Payment Redirect (49) or Payment Host to Host (50).
    supporting_sections:
      - {document_id: snap-data-technical-spec, section_id: "5.2.2"}
