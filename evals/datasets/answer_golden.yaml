# Golden-answer dataset (docs/p9-final-evaluation-packaging/spec.md, Data; AC #7). SYNTHETIC questions.
# ga-001..ga-050 ask the 50 labelled retrieval queries (q01-q30 original, h01-h20 hard set) with the same gold
# sections; ga-051..ga-080 cover the synthetic spec, the SOP, response codes and validator fixtures; ga-081..ga-100
# must refuse, say NOT_FOUND or abstain. Expected facts are paraphrased (no ASPI text copied beyond short technical
# tokens). Drafted by Claude on 2026-11-15; `reviewed_by`/`reviewed_on` are filled only by the developer's review.
# Items marked `# CHECK:` need the reviewer's attention.
dataset_version: 1.0.0
items:
  - id: ga-001
    source_query: q01
    category: retrieval
    language: id
    question: Bagaimana menyusun stringToSign untuk signature asimetris saat meminta access token B2B?
    context: null
    expected_behaviour: answer
    expected_facts:
      - "For the B2B access-token request, stringToSign is client_ID + \"|\" + X-TIMESTAMP."
      - The X-SIGNATURE is an asymmetric SHA256withRSA signature made with the private key over that stringToSign.
      - The client_ID is the value sent in the X-CLIENT-KEY header, issued at registration.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.5"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-002
    source_query: q02
    category: retrieval
    language: en
    question: Which algorithm is used to sign the B2B access token request, and how long is the token valid?
    context: null
    expected_behaviour: answer
    expected_facts:
      - The B2B access-token request is signed with SHA256withRSA (asymmetric, private key).
      - The B2B token response gives expiresIn as 900 seconds, i.e. 15 minutes.
      - The B2B access-token service is service code 73, POST to .../{version}/access-token/b2b.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.5"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-003
    source_query: q03
    category: retrieval
    language: id
    question: Header apa saja yang wajib dikirim pada request transaksi yang memakai signature asimetris?
    context: null
    expected_behaviour: answer
    expected_facts:
      - X-TIMESTAMP and X-SIGNATURE are mandatory headers on a B2B transaction request; Content-Type is also mandatory.
      - X-PARTNER-ID (max 36), X-EXTERNAL-ID (max 36, unique within the same day) and CHANNEL-ID (5) are mandatory.
      - ORIGIN is optional, and Authorization is only conditional for the B2B transaction request.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.6#2"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-004
    source_query: q04
    category: retrieval
    language: en
    question: How is the symmetric HMAC_SHA512 signature for a transaction request calculated?
    context: null
    expected_behaviour: answer
    expected_facts:
      - The symmetric signature is HMAC_SHA512 keyed with the clientSecret over stringToSign.
      - "stringToSign = HTTPMethod:EndpointUrl:AccessToken:Lowercase(HexEncode(SHA-256(minify(RequestBody)))):TimeStamp, joined with \":\"."
      - The body component is the lowercase hex SHA-256 hash of the minified request body.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.6#1"}
    reviewed_by: null
    reviewed_on: null
  # CHECK: the gold sections give the formula (minify, SHA-256, lowercase hex) but never state WHY the body is minified and hashed; facts below are limited to what the text says.
  - id: ga-005
    source_query: q05
    category: retrieval
    language: id
    question: Mengapa request body harus di-minify lalu di-hash sebelum dimasukkan ke string yang ditandatangani?
    context: null
    expected_behaviour: answer
    expected_facts:
      - Both the symmetric and asymmetric stringToSign include Lowercase(HexEncode(SHA-256(minify(RequestBody)))) rather than the raw body.
      - When there is no request body, an empty string is used as the minify(RequestBody) input.
      - The answer must not claim a documented rationale for minifying; the cited sections only define the formula.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.6#1"}
      - {document_id: snap-technical-security-standard, section_id: "2.1.6#2"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-006
    source_query: q06
    category: retrieval
    language: en
    question: What TLS version and cipher requirements apply to the secured communication channel?
    context: null
    expected_behaviour: answer
    expected_facts:
      - The secured channel standard is TLS 1.3.
      - Negotiating down to TLS 1.2 is allowed only with the minimum cipher suites listed (DHE/ECDHE RSA with AES-128-GCM-SHA256 or AES-256-GCM-SHA384).
      - The TLS 1.2 fallback with those suites is permitted only until 30 June 2026.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.10"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-007
    source_query: q07
    category: retrieval
    language: id
    question: Bagaimana cara pengiriman API public key dari pengguna layanan ke penyedia layanan?
    context: null
    expected_behaviour: answer
    expected_facts:
      - The API Public Key can be received either by a PIC or by an application system that processes it.
      - The sender protects the key with encryption or a password, and the receiver decrypts it or uses the known password.
      - "Delivery options: password-protected zip by email, PGP-encrypted file by email, OpenSSL-encrypted file with the partner's public key by email, or online via an application."
      - When a zip is emailed, the zip and its password are sent in separate emails.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "1.7.1"}
      - {document_id: snap-technical-security-standard, section_id: "1.7.2"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-008
    source_query: q08
    category: retrieval
    language: en
    question: What are the requirements for storing and managing cryptographic keys securely?
    context: null
    expected_behaviour: answer
    expected_facts:
      - Key management follows a confidentiality principle and needs an access-rights procedure for key management.
      - Keys are stored in a secure database that only authorised parties can access.
      - There must be procedures for key creation, renewal, deletion and encryption/decryption, using algorithms recommended by international or national standards bodies.
      - The master key version in use must be clear, and key usage must be open to monitoring and audit.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "1.8"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-009
    source_query: q09
    category: retrieval
    language: id
    question: Format data dan character encoding apa yang digunakan pada API SNAP?
    context: null
    expected_behaviour: answer
    expected_facts:
      - Request and response bodies use JSON (JavaScript Object Notation).
      - The character encoding is UTF-8.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.2"}
      - {document_id: snap-technical-security-standard, section_id: "2.1.3"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-010
    source_query: q10
    category: retrieval
    language: en
    question: Which HTTP methods are allowed for SNAP API requests?
    context: null
    expected_behaviour: answer
    expected_facts:
      - The HTTP verbs used are POST, GET, DELETE and PUT.
      - The get-access-token service uses POST for security reasons.
      - Other services use the verb that fits their operation, as listed in each service's general information table in the technical spec.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.4"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-011
    source_query: q11
    category: retrieval
    language: en
    question: How should the URI path of a SNAP endpoint include the API version?
    context: null
    expected_behaviour: answer
    expected_facts:
      - The resource path pattern is /[domain_api]/[version]/[service-group]/[product-type].
      - The version segment is written as /v[major-version].[minor-version]/.
      - The version follows the API domain and precedes the service group.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.11"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-012
    source_query: q12
    category: retrieval
    language: id
    question: Standar enkripsi apa yang dipakai untuk melindungi data sensitif?
    context: null
    expected_behaviour: answer
    expected_facts:
      - Symmetric encryption uses AES-256 with the client secret as the encryption key.
      - The asymmetric signature standard is SHA256withRSA with a private/public key pair.
      - The symmetric signature standard is HMAC_SHA512 (512 bits).
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.9"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-013
    source_query: q13
    category: retrieval
    language: id
    question: Format X-TIMESTAMP yang benar pada header request, termasuk zona waktunya
    context: null
    expected_behaviour: answer
    expected_facts:
      - X-TIMESTAMP is mandatory and carries the client's current local time in yyyy-MM-ddTHH:mm:ss.SSSTZD format.
      - The TZD part is a time-zone offset; the examples use +07:00.
      - The same X-TIMESTAMP value is the TimeStamp component of the transaction stringToSign.
    supporting_sections:
      - {document_id: snap-technical-security-standard, section_id: "2.1.5"}
      - {document_id: snap-technical-security-standard, section_id: "2.1.6#2"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-014
    source_query: q14
    category: retrieval
    language: id
    question: Endpoint dan field request untuk generate QR MPM
    context: null
    expected_behaviour: answer
    expected_facts:
      - Generate QR MPM is service code 47, POST to .../{version}/qr/qr-mpm-generate.
      - Request fields include partnerReferenceNo, amount (value and currency), feeAmount, merchantId, subMerchantId, storeId, terminalId, validityPeriod and additionalInfo.
      - Inside amount, value (16,2, two decimal digits) and currency (ISO 4217, e.g. IDR) are mandatory.
    supporting_sections:
      - {document_id: snap-data-technical-spec, section_id: "4.3.5"}
    reviewed_by: null
    reviewed_on: null
  - id: ga-015
    source_query: q15
    category: retrieval
    language: en
    question: How do I query whether a QR MPM payment has been paid?
    context: null
    expected_behaviour: answer
    expected_facts:
      - Use the Query Payment API, service code 51, POST to .../{version}/qr/qr-mpm-query.
      - serviceCode of the original transaction (47/49/50) is mandatory; original reference numbers identify the transaction.
      - The response's latestTransactionStatus gives the state, where 00 means success and 03 pending.
      - paidTime is filled when the original transaction succeeded.
    supporting_sections:
      - {document_id: snap-data-technical-spec, section_id: "4.3.5"}
    reviewed_by: null
    reviewed_on: null
