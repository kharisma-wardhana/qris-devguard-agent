# p7 security evidence matrix (docs/p7-mcp-hardening/spec.md AC #21, #25; TRD §22.5 and §13.4).
# Every §22.5 bullet and every testable §13.4 control is a case. A case PASSES only when every pytest node it names
# passes; a skipped node (no PostgreSQL) makes the case NOT RUN, never PASS. scripts/eval_security.py runs them all
# and renders the matrix into docs/p7-mcp-hardening/security-report.md. Payloads are synthetic; secrets in them are
# described, never shown.
version: 1
cases:
  # --- TRD §22.5 -----------------------------------------------------------------------------------------------
  - id: S01
    section: "22.5"
    bullet: Missing/invalid authentication
    payload: "MCP and API calls with no token, a garbage token, a token signed with another secret, an expired token, alg none/HS512, wrong audience (MCP token at the API and API token at MCP)"
    expected: "HTTP 401 with the §18 envelope before any tool or route runs; MCP refusals audited as phase=refused"
    tests:
      - tests/integration/test_mcp_server.py::test_unauthenticated_requests_get_401
      - tests/integration/test_mcp_server.py::test_mint_dev_token_audience_option
      - tests/integration/test_api_server.py::test_authentication
      - tests/unit/test_mcp_auth.py::test_invalid_tokens_are_refused
      - tests/integration/test_mcp_audit.py::test_unauthenticated_request_is_audited_as_refused
  - id: S02
    section: "22.5"
    bullet: Authenticated user without permission for write tool
    payload: "kb_maintainer calls create_support_ticket and validate_test_signature; developer and kb_maintainer try to decide an approval; a requester tries to approve their own action as admin"
    expected: "FORBIDDEN (MCP) / 403 (API); no ticket; the database roles cannot reach tables outside their grant"
    tests:
      - tests/unit/test_ticket_tool.py::test_kb_maintainer_is_forbidden
      - tests/unit/test_mcp_tools.py::test_role_matrix
      - tests/unit/test_api_threads.py::test_non_approver_roles_cannot_decide
      - tests/unit/test_api_threads.py::test_requester_cannot_self_approve_even_as_admin
      - tests/integration/test_crash_resume.py::test_approver_must_be_another_person
      - tests/unit/test_db_roles.py
  - id: S03
    section: "22.5"
    bullet: Malformed JSON and schema bypass attempts
    payload: "Truncated JSON, an array or string as the JSON-RPC body, an unknown method, an unknown tool name, extra arguments, wrong types, out-of-range enums; malformed API bodies"
    expected: "A fixed JSON-RPC error or the §18 INVALID_ARGUMENT envelope; no submitted value echoed; no handler runs"
    tests:
      - tests/integration/test_mcp_server.py::test_malformed_jsonrpc_gets_a_fixed_message_without_echo
      - tests/integration/test_mcp_server.py::test_bad_tool_calls_get_the_envelope_without_echo
      - tests/unit/test_mcp_tools.py::test_bad_types_ranges_and_enums
      - tests/unit/test_mcp_tools.py::test_extra_field_rejected
      - tests/unit/test_api.py::test_malformed_body_gets_422_without_values
  - id: S04
    section: "22.5"
    bullet: Oversized input
    payload: "API body over limits.max_request_bytes (declared and chunked); MCP body over max_body_bytes; payload argument over max_payload_bytes"
    expected: "413 PAYLOAD_TOO_LARGE before parsing (no body bytes echoed); INVALID_ARGUMENT for an oversized payload argument"
    tests:
      - tests/integration/test_api_server.py::test_oversized_body_gets_413_before_parsing
      - tests/integration/test_mcp_server.py::test_oversized_body_gets_413_envelope
      - tests/unit/test_mcp_tools.py::test_oversized_payload_rejected
      - tests/unit/test_security_body_limit.py
  - id: S05
    section: "22.5"
    bullet: Excessive request rate
    payload: "Concurrent burst of /api/v1/chat by one subject; 2x the tool-call burst by one subject in one MCP session; a flood of unauthenticated requests from one address"
    expected: "429 RATE_LIMITED with Retry-After (API, MCP pre-auth) or a RATE_LIMITED tool error (MCP per subject); other subjects unaffected"
    tests:
      - tests/integration/test_api_server.py::test_agent_run_route_burst_gets_429_and_other_subject_is_unaffected
      - tests/integration/test_mcp_server.py::test_per_subject_tool_burst_is_throttled
      - tests/integration/test_mcp_server.py::test_per_address_flood_is_throttled_before_auth
      - tests/unit/test_security_ratelimit.py
  - id: S06
    section: "22.5"
    bullet: Prompt injection asking the model to ignore policy or call a hidden tool
    payload: "10 cases (evals/datasets/injection_cases.yaml): 5 in the user turn (hidden tool, pre-approved ticket, role claim, prompt/token exfiltration, metadata fetch) and 5 planted in a retrieved approved document"
    expected: "Tool calls equal the benign baseline; no tool outside the role executes; no ticket, approval or action; verdicts only from validators; planted text proven retrieved"
    tests:
      - tests/integration/test_injection.py::test_injection_case
      - tests/integration/test_injection.py::test_checks_flag_violations
      - tests/unit/test_agent_graph.py::test_injection_in_message_does_not_change_tools
      - tests/unit/test_agent_graph.py::test_policy_actions_recorded_for_a_lying_model
  - id: S07
    section: "22.5"
    bullet: Tool argument injection in identifiers/strings
    payload: "Path, URL, SQL, shell, newline and Windows-path strings in six identifier fields; secret-shaped values in every string argument"
    expected: "INVALID_ARGUMENT before the handler; no value in the response, the log line or any audit row"
    tests:
      - tests/unit/test_mcp_tools.py::test_injection_strings_rejected_before_handler
      - tests/unit/test_mcp_tools.py::test_secret_shaped_values_never_in_response_or_log
      - tests/integration/test_mcp_audit.py::test_secret_shaped_arguments_never_reach_the_audit_table
  - id: S08
    section: "22.5"
    bullet: SQL-like payloads and path traversal strings
    payload: "SQL-like text in ticket title/body through the approved path; traversal strings in identifiers and free text; a SQL-shaped run-id header"
    expected: "Identifiers refused; free text stored literally through parameterised queries; tables intact; bad header dropped"
    tests:
      - tests/integration/test_security_suite.py::test_sql_like_ticket_text_is_stored_literally
      - tests/unit/test_mcp_tools.py::test_injection_strings_rejected_before_handler
      - tests/integration/test_mcp_audit.py::test_bad_run_id_header_is_dropped
      - tests/unit/test_audit.py::test_valid_uuid
  - id: S09
    section: "22.5"
    bullet: SSRF attempts including localhost, private IP, link-local, and redirect targets
    payload: "Metadata, RFC 1918, mapped-IPv6, metadata-host, redirect, file:, gopher:, traversal and UNC strings in every tool argument and a chat message; disallowed configured destinations; 302 to another host"
    expected: "No outbound connection or name lookup outside the allowlist (socket guard, with a positive control); start-up refuses disallowed destinations; no client follows a redirect"
    tests:
      - tests/integration/test_injection.py::test_ssrf_strings_in_tool_arguments_open_no_outbound_connection
      - tests/integration/test_injection.py::test_ssrf_strings_in_a_chat_message_open_no_outbound_connection
      - tests/integration/test_injection.py::test_guard_catches_an_unexpected_connection
      - tests/unit/test_security_egress.py
      - tests/integration/test_mcp_server.py::test_server_refuses_a_disallowed_destination
      - tests/integration/test_api_server.py::test_api_refuses_a_disallowed_destination
  - id: S10
    section: "22.5"
    bullet: Cross-user/thread ID substitution
    payload: "Another owner's thread ID on every thread route; another user's approval; an approval replayed on another thread"
    expected: "404 for threads (same as unknown); APPROVAL_INVALID for approvals; no ticket"
    tests:
      - tests/unit/test_api_threads.py::test_other_owner_and_unknown_threads_are_404
      - tests/unit/test_ticket_tool.py::test_other_user_or_thread_is_invalid
      - tests/integration/test_security_suite.py::test_unauthorized_write_paths_create_nothing
  - id: S11
    section: "22.5"
    bullet: Approval replay, expired approval, and changed action payload
    payload: "Second decision on a decided approval; expired approval; pending/rejected approval; any changed payload field"
    expected: "409 CONFLICT / APPROVAL_EXPIRED; APPROVAL_NOT_USABLE; APPROVAL_MISMATCH; no ticket"
    tests:
      - tests/unit/test_ticket_tool.py::test_changed_payload_is_a_mismatch
      - tests/unit/test_ticket_tool.py::test_expired_approval
      - tests/unit/test_ticket_tool.py::test_pending_or_rejected_is_not_usable
      - tests/unit/test_api_threads.py::test_expired_decision_is_409_and_creates_nothing
      - tests/unit/test_api_threads.py::test_approve_creates_one_ticket_and_second_decision_conflicts
  - id: S12
    section: "22.5"
    bullet: Duplicate action replay with same idempotency key
    payload: "The same create_support_ticket call twice; a crash between the insert and the checkpoint, then resume; API killed mid-approval and restarted"
    expected: "already_created with the same ticket ID; exactly one ticket per key"
    tests:
      - tests/unit/test_ticket_tool.py::test_replay_returns_the_same_ticket
      - tests/unit/test_agent_hitl.py::test_crash_between_insert_and_checkpoint_resumes_to_the_same_ticket
      - tests/integration/test_crash_resume.py::test_crash_resume_exactly_one_ticket
  - id: S13
    section: "22.5"
    bullet: Secret in prompt to verify redaction before logs/traces/checkpoints
    payload: "A synthetic client_secret, bearer token and PEM block in the message and the payload context, through a full escalation and approval"
    expected: "None of them in any table (incl. tool_audit_logs and checkpoints), in the captured API/MCP logs, or in any response"
    tests:
      - tests/integration/test_security_suite.py::test_secret_in_prompt_reaches_no_table_log_or_response
      - tests/integration/test_crash_resume.py::test_no_secret_in_any_table_or_checkpoint
      - tests/unit/test_agent_graph.py::test_secrets_never_reach_state_llm_or_answer
      - tests/unit/test_agent_hitl.py::test_no_secret_in_any_checkpoint_of_the_history
  - id: S14
    section: "22.5"
    bullet: "Pass condition: zero unauthorized side effects"
    payload: "Every unauthorized write path against the real MCP server; every ticket in the test schema"
    expected: "Zero tickets from unauthorized paths; every ticket has an executed approval decided by someone other than its requester"
    tests:
      - tests/integration/test_security_suite.py::test_unauthorized_write_paths_create_nothing
      - tests/integration/test_security_suite.py::test_every_ticket_has_an_executed_four_eyes_approval
  # --- TRD §13.4 controls not already covered above ------------------------------------------------------------
  - id: G-AUDIT
    section: "13.4"
    bullet: Auditability
    payload: "Every tool outcome, 401 refusals, the write tool with a failing audit store, purge"
    expected: "One row per call (attempt+result for the write tool) with actor, role, tool, outcome, correlation and run ID; write tool fails closed"
    tests:
      - tests/integration/test_mcp_audit.py
      - tests/unit/test_audit.py
      - tests/integration/test_purge_audit_cli.py
  - id: G-LEASTPRIV
    section: "13.4"
    bullet: Least privilege
    payload: "Each runtime role attempts every statement outside its grant; services started without their role password"
    expected: "Permission errors for every may-not cell; services refuse to start rather than use the owner"
    tests:
      - tests/unit/test_db_roles.py
      - tests/integration/test_api_server.py::test_api_with_database_but_no_role_password_refuses_to_start
      - tests/integration/test_mcp_server.py::test_server_with_database_but_no_role_password_refuses_to_start
      - tests/integration/test_crash_resume.py::test_crash_resume_exactly_one_ticket
  - id: G-TRANSPORT
    section: "13.4"
    bullet: Transport security (internal ports not public)
    payload: "Configured listeners and compose ports; a non-loopback host in config; a connection to the API's non-loopback address"
    expected: "Everything binds 127.0.0.1; servers refuse a non-loopback host"
    tests:
      - tests/unit/test_compose.py
      - tests/integration/test_api_server.py::test_api_listens_on_loopback_only
  - id: G-TIMEOUT
    section: "13.4"
    bullet: Timeout/retry
    payload: "MCP server unreachable; an error envelope from a tool"
    expected: "Bounded retry then TOOL_UNAVAILABLE; envelopes are not retried; the only write is idempotent by key"
    tests:
      - tests/unit/test_agent_tools.py::test_unreachable_server_gives_tool_unavailable_after_bounded_retry
      - tests/unit/test_agent_tools.py::test_envelope_is_not_retried
      - tests/unit/test_ticket_tool.py::test_replay_returns_the_same_ticket
  - id: G-ERRORS
    section: "13.4"
    bullet: Error handling
    payload: "A crashing tool handler; a crashing API route"
    expected: "INTERNAL_ERROR envelope with only a correlation ID; no trace, type or value"
    tests:
      - tests/unit/test_mcp_tools.py::test_internal_error_is_safe
      - tests/unit/test_api.py::test_internal_error_is_safe
      - tests/unit/test_audit.py::test_internal_error_is_audited
