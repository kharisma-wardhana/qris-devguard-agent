# Security boundaries fixed in Phase P0 (docs/scope.md §2–3, docs/threat-model.md).
# They are enforced in code from Phase P4/P7 onward. Changing this file changes the threat model; review both together.

environment_allowlist: [sandbox]

# Outbound hosts the application may contact. Anything else is denied (T9).
egress_allowlist:
  - vllm
  - qdrant
  - postgres
  - localhost            # self-hosted Langfuse (p1-infrastructure); was cloud.langfuse.com

# Risk classes (TRD §15.1)
risk_policy:
  low: auto_execute
  medium: draft_only
  high: approval_required
  prohibited: hard_deny

tools:
  search_qris_spec:        { risk: low,  roles: [developer, support_engineer, kb_maintainer, admin] }
  validate_request_payload: { risk: low,  roles: [developer, support_engineer, admin] }
  validate_test_signature: { risk: low,  roles: [developer, support_engineer, admin] }
  lookup_response_code:    { risk: low,  roles: [developer, support_engineer, kb_maintainer, admin] }
  create_support_ticket:   { risk: high, roles: [developer, support_engineer, admin] }

# Who may approve high-risk actions. kb_maintainer is excluded for separation of duties.
approver_roles: [support_engineer, admin]
approval_ttl_minutes: 30

# Actions that must never exist as tools
prohibited_actions:
  - payment
  - refund
  - reversal
  - settlement
  - merchant_activation
  - production_api_call
  - production_credential_operation

# Redaction runs before DB persistence, checkpoint serialisation and Langfuse export (TRD §19.2).
# Matching is case-insensitive on field names.
redact_fields:
  - authorization
  - access_token
  - accesstoken
  - client_secret
  - clientsecret
  - private_key
  - privatekey
  - secret
  - password
  - signature
  - x-signature
  - x-client-key

redact_patterns:
  pem_block: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
  bearer_token: "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{16,}"

limits:
  max_message_chars: 8000
  max_payload_bytes: 32768
  # p7: whole request body, refused with 413 before parsing (API). Room for an 8000-char message (up to
  # 4 bytes each in UTF-8) plus a 32 KiB payload and JSON overhead. The MCP server keeps mcp.yaml max_body_bytes.
  max_request_bytes: 131072
  # p7 (T12): in-process token buckets, per process, reset on restart (docs/p7-mcp-hardening/spec.md).
  rate:
    per_address:   { per_minute: 300, burst: 100 }   # before authentication, API and MCP; loopback = one bucket
    api_agent_run: { per_minute: 10,  burst: 5 }     # per subject: /chat, /threads/{id}/messages, /threads/{id}/resume
    api_other:     { per_minute: 60,  burst: 20 }    # per subject: thread and approval reads, decisions, thread create
    mcp_tool_call: { per_minute: 120, burst: 40 }    # per subject, every tools/call
    max_keys: 10000                                  # oldest key evicted beyond this

# p7: MCP tool-call audit trail (TRD §13.4 Auditability, §19.3 retention). Purged by scripts/purge_audit.py.
audit:
  retention_days: 90

# Citation policy by manifest permission.basis (docs/scope-and-source-inventory/spec.md).
# Enforced by the citation layer from Phase P2/P5.
citations:
  max_excerpt_chars:
    reference_only: 300     # public documents with no published terms: short quotes only
    team_authored: 1000     # synthetic documents; the SYNTHETIC label must stay attached
  label_synthetic: true

# p8: answer-echo fencing (docs/p8-memory-observability/spec.md §4). Generic categories of instruction-shaped
# text, not the P7 test canaries. A sentence matching one is removed from evidence excerpts before the prompt
# (sources keep the original quote) and from generated answer text. Case-insensitive.
injection_markers:
  override: '\b(?:ignore|disregard|forget|override)\s+(?:all\s+|any\s+|the\s+|its\s+|your\s+|my\s+|their\s+)?(?:previous|prior|above|earlier|system)\s+(?:instructions?|rules?|prompts?)\b|\bsystem\s+override\b|\byou\s+are\s+now\b|\bnew\s+instructions?\s*:'
  approval_claim: '\bpre-?(?:approved|authori[sz]ed|granted)\b|\b(?:approval|permission)\s+(?:is\s+|has\s+been\s+)?(?:already\s+)?granted\b|\balready\s+(?:approved|authori[sz]ed)\b'
  tool_invocation: '\b(?:call|run|execute|invoke|trigger)\s+(?:the\s+)?(?:tool\s+)?`?[a-z]+_[a-z_]+`?\s*(?:\(|tool\b|now\b|with\b)|\b(?:drop|delete\s+from|insert\s+into|update)\s+(?:table\s+)?[a-z_]+\s*(?:;|set\b|values\b)'
  secret_variable: '(?-i:\b[A-Z][A-Z0-9_]*_(?:API_KEY|SECRET(?:_KEY)?|TOKEN|PASSWORD)\b)'   # case-sensitive: lowercase access_token is ordinary spec text
  internal_address: '\bcomputeMetadata\b|\bmetadata\.google\.internal\b|\b169\.254\.\d{1,3}\.\d{1,3}\b|\blocalhost:\d{2,5}\b'

# p8: pattern text is refused (not redacted) when it looks like a secret or personal data (spec §1).
# redact_fields and redact_patterns above apply as well.
pattern_refusal:
  email: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
  phone: '(?<!\d)(?:\+?62|0)8\d{7,11}(?!\d)'
  long_digit_run: '(?<!\d)\d{10,}(?!\d)'
