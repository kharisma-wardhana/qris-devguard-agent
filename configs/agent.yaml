# LangGraph agent and /api/v1 (p5-langgraph-agent spec). Model identity comes from configs/model.yaml;
# roles per tool from configs/security.yaml; tool limits from configs/mcp.yaml. Nothing here repeats them.

llm:
  base_url_env: VLLM_BASE_URL          # http://127.0.0.1:8080/v1 through scripts/tunnel.sh
  api_key_env: VLLM_API_KEY
  served_name_from: configs/model.yaml # model.served_name
  temperature: 0
  max_tokens: 1200
  timeout_seconds: 60
  json_retries: 1                      # one retry on malformed JSON, then the deterministic fallback
  enable_thinking: false               # Qwen3 chat template; no reasoning tokens in the answer
  prompt_version: compose-v2           # p8: fenced evidence, preference notes, verified-patterns block

tools:
  mcp_url: http://127.0.0.1:8765/mcp   # configs/mcp.yaml server host/port/path
  timeout_seconds: 90                  # a cold search loads BGE-M3 (~30 s measured in p4)
  transient_retries: 1                 # connection errors only; tool error envelopes are never retried
  token_ttl_minutes: 5                 # per-run MCP token, minted for the caller's sub and role

retrieval:
  top_k: 6
  rerank: false                        # CPU reranker ~160 s/query (p3); rerank_evidence passes fused order through

api:
  host: 127.0.0.1                      # loopback only
  port: 8000
  audience: qris-devguard-api          # MCP tokens use qris-devguard-mcp (configs/mcp.yaml); never forwarded
  max_message_chars: 8000              # configs/security.yaml limits.max_message_chars

classify:
  code_regex: '(?<!\d)([2-5]\d{6})(?!\d)'
  version_regex: '(?<![\d.])(\d{1,3}\.\d{1,3}\.\d{1,3})(?![\d.])'
  keywords:
    signature: [signature, signing, string to sign, stringtosign, x-signature, sha256withrsa, hmac, tanda tangan, signatur]
    timestamp: [timestamp, x-timestamp, waktu, iso-8601, iso8601, time zone, zona waktu]
    payload: [payload, request body, body request, field, header, mandatory, wajib]
    response_code: [response code, responsecode, kode respons, kode response, error code]
    version_question: [version, versi, older spec, spesifikasi lama, which version]
  write: [create ticket, create a ticket, open a ticket, submit ticket, escalate, eskalasi, buat tiket, retry the, change config, ubah konfigurasi, modify record]
  # Prohibited = asking to DO a prohibited action: an action verb followed within `verb_window` words by a
  # prohibited object (these objects plus security.yaml prohibited_actions), or an explicit production phrase.
  # A bare mention ("what does the refund response code mean", "Query Payment") is a read question.
  action_verbs: [make, process, execute, perform, initiate, issue, trigger, run, lakukan, proses, jalankan, kirim, buat]   # not "do"/"send": "what do I send for the refund code" is a read question
  verb_window: 4
  prohibited_objects: [payment, pembayaran, refund, reversal, settlement, merchant activation, aktivasi merchant, transfer, transfer dana]
  prohibited_phrases: [production api, production endpoint, production key, production credential, live secret, private key produksi, kredensial produksi, api produksi]

database:                              # p6: local PostgreSQL (docker-compose.yml, 127.0.0.1:5432)
  url_env: DATABASE_URL                # postgresql+psycopg://... in .env (scripts/init_env.py)
  test_url_env: DEVGUARD_TEST_DATABASE_URL
  pool_max_size: 5
  connect_timeout_seconds: 3           # refused loopback ports can hang on this machine (CLAUDE.md)
  roles:                               # p7: least-privilege runtime roles (docs/p7-mcp-hardening/spec.md Behaviour §4)
    app:    {name: devguard_app,    password_env: DEVGUARD_APP_DB_PASSWORD}      # API + agent + checkpointer
    ticket: {name: devguard_ticket, password_env: DEVGUARD_TICKET_DB_PASSWORD}   # MCP create_support_ticket only
    audit:  {name: devguard_audit,  password_env: DEVGUARD_AUDIT_DB_PASSWORD}    # MCP audit writer, insert-only

evidence_order:                        # p6 flow-1 fix: endpoint section first, then the api family's documents
  endpoint_sections:
    access-token-b2b: {document_id: snap-technical-security-standard, section_prefix: "2.1.5"}
    qr-mpm-generate: {document_id: synthetic-qris-mpm-service-spec, section_prefix: "2"}
    qr-mpm-query: {document_id: synthetic-qris-mpm-service-spec, section_prefix: "3"}
  profile_endpoints:
    snap-asymmetric-access-token-v1: access-token-b2b

ticket_draft:                          # p6: the only side effect; values are sanitized before drafting
  title_max_chars: 200
  body_max_chars: 4000
  max_evidence_ids: 10
  default_priority: medium

memory:                                # p8: long-term memory policy (TRD §16; docs/p8-memory-observability/spec.md §1)
  preferences:                         # the only keys and values that can be saved; anything else is refused
    language: [id, en]
    detail: [brief, detailed]
  preference_notes:                    # the trusted <notes> line each saved value adds to the prompt
    language: {id: "Answer in Indonesian.", en: "Answer in English."}
    detail: {brief: "Keep the answer brief.", detailed: "Give a detailed answer."}
  # Explicit chat phrases, matched case-insensitively in the sanitized message. The model never decides a save.
  phrase_prefix: '\b(?:remember|ingat)\s*:'
  phrases:
    - {pattern: '\b(?:remember|ingat)\s*:\s*(?:always\s+)?(?:answer|reply|respond)\s+in\s+(?:bahasa\s+)?indonesian?\b', key: language, value: id}
    - {pattern: '\b(?:remember|ingat)\s*:\s*(?:selalu\s+)?jawab\s+(?:dalam|pakai|dengan)\s+bahasa\s+indonesia\b', key: language, value: id}
    - {pattern: '\b(?:remember|ingat)\s*:\s*(?:always\s+)?(?:answer|reply|respond)\s+in\s+english\b', key: language, value: en}
    - {pattern: '\b(?:remember|ingat)\s*:\s*(?:selalu\s+)?jawab\s+(?:dalam|pakai|dengan)\s+bahasa\s+inggris\b', key: language, value: en}
    - {pattern: '\b(?:remember|ingat)\s*:\s*(?:keep\s+(?:it|answers?)\s+)?(?:brief|short)\b', key: detail, value: brief}
    - {pattern: '\b(?:remember|ingat)\s*:\s*jawab\s+(?:singkat|ringkas)\b', key: detail, value: brief}
    - {pattern: '\b(?:remember|ingat)\s*:\s*(?:give\s+)?(?:detailed|full)\s+answers?\b', key: detail, value: detailed}
    - {pattern: '\b(?:remember|ingat)\s*:\s*jawab\s+(?:detail|lengkap|rinci)\b', key: detail, value: detailed}
  preference_ttl_days: 180             # review date for a preference (§16.2 "separate review/expiry date")
  pattern_ttl_days: 90                 # §16.2 / §19.3 default
  max_patterns_in_prompt: 2
  pattern_title_max_chars: 120
  pattern_text_max_chars: 1000
  decision_reason_max_chars: 500

observability:                         # p8: Langfuse tracing (TRD §21; spec §2). Keys and host come from .env.
  enabled: true                        # also off whenever LANGFUSE_PUBLIC_KEY/SECRET_KEY/HOST are missing (CI)
  host_env: LANGFUSE_HOST
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY
  environment: capstone
  service_tag: "service:agent"
  export_timeout_seconds: 2            # refused loopback ports can hang on this machine (CLAUDE.md)
  test_delay_env: DEVGUARD_TEST_DELAY_MS   # test-only delay inside classify_intent, for the p95 alert test
  test_delay_max_ms: 5000
  manifest_path: knowledge_base/manifests/sources.yaml   # corpus version = sha256 prefix of this file

retention:                             # p8: TRD §19.3, run by scripts/purge_retention.py as the owner role
  checkpoint_days: 30
  approval_days: 90                    # approvals, their sandbox tickets, and threads with nothing newer

ui:                                    # p9: Streamlit demo UI (docs/p9-demo-ui-alerts/spec.md Behaviour §1, §7)
  host: 127.0.0.1                      # loopback only; scripts/ui_server.py refuses anything else
  port: 8501
  api_url: http://127.0.0.1:8000       # api.host/api.port; the UI calls /api/v1 only
  token_ttl_minutes: 15                # API-audience demo tokens, minted in-process; re-minted before expiry
  request_timeout_seconds: 150         # a cold first search loads BGE-M3 (52 s measured in p8)
  refresh_seconds: 15                  # Alerts page auto-refresh, when switched on
  identities:                          # synthetic demo subjects only (demo-only; see the p9 runbook)
    - {sub: demo-dev, role: developer, label: "Developer (demo-dev)"}
    - {sub: demo-approver, role: support_engineer, label: "Approver (demo-approver)"}

alerts:                                # p9: Langfuse alert webhook receiver and reader (spec Behaviour §5, §6, Data)
  store_path: var/alerts/alerts.jsonl  # git-ignored; the receiver writes it, the API reads it
  secret_env: LANGFUSE_ALERT_WEBHOOK_SECRET   # copied by the developer from the Langfuse webhook; never printed
  max_body_bytes: 65536
  max_clock_skew_seconds: 600          # our replay window on the signed t=; Langfuse defines none
  max_records: 500
  title_max_chars: 200
  body_max_chars: 1000
  langfuse_base_url: http://localhost:3000/   # NEXTAUTH_URL in docker-compose.yml; other permalinks are dropped
  list_limit: 50
