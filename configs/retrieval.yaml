# Knowledge pipeline and retrieval settings (docs/p2-knowledge-pipeline/spec.md).
# Retrieval parameters live here, not in code (CLAUDE.md). Values are a first
# configuration; P3 tunes them against evals/datasets/retrieval_golden.yaml.

collection: qris_kb_v1

qdrant:
  url_env: QDRANT_URL                 # read from the environment / .env
  default_url: http://127.0.0.1:6333

embedding:
  model_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181   # pinned; MIT licence
  dimension: 1024
  max_seq_length: 1536                # tokens. Was 1024; raised 2026-11-09 (user decision) after the real
                                      # data spec measured 3.25 chars/token (estimate assumes 4) and its
                                      # longest chunk reached 1,275 tokens. Model limit is 8192.
  batch_size: 8

chunking:
  target_tokens: 600                  # TRD §12.2: 400-800
  max_tokens: 800
  overlap_tokens: 80                  # TRD §12.2: 60-100; only inside a long section
  chars_per_token: 4                  # estimate: tokens = characters / 4
  # PDF section headings: a line that starts with a section number and a title.
  # Checked against the real ASPI PDFs in plan step 10; group 1 = number, group 2 = title.
  # Month names are excluded so dates ("12 Mei 2024") are not read as headings.
  # Bold is required too: checked 2026-11-07 on both ASPI PDFs, where headings are
  # BookmanOldStyle-Bold 12pt and TOC rows / numbered list items are regular or italic.
  pdf_heading_requires_bold: true
  pdf_heading_pattern: '^(\d{1,2}(?:\.\d{1,2}){0,3})\.?\s+(?!(?:Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember|January|February|March|May|June|July|August|October|December)\b)([A-Z][^.!?]{2,90})$'

sparse:                               # project BM25 encoder; Qdrant applies IDF
  k1: 1.2
  b: 0.75
  avg_doc_len: 300                    # terms per chunk; fixed so re-ingesting one document doesn't
                                      # shift others' weights. Each ingest run records the measured average.

search:
  dense_prefetch: 30                  # TRD §12.3: 20-30 candidates
  sparse_prefetch: 30
  limit: 20

ingest:
  max_file_mb: 50
  types:
    .pdf: application/pdf
    .md: text/markdown
