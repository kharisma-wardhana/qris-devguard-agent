# MCP server and deterministic validators (p4-deterministic-mcp-tools spec).
# Roles per tool live in configs/security.yaml (single source of truth); this file never repeats them.

server:
  name: qris-devguard-mcp
  host: 127.0.0.1            # loopback only (T13); never 0.0.0.0
  port: 8765
  path: /mcp
  max_body_bytes: 65536      # 2x security.yaml limits.max_payload_bytes, for the JSON-RPC wrapper

auth:
  secret_env: MCP_AUTH_SECRET
  min_secret_chars: 32
  algorithm: HS256           # the only algorithm accepted
  audience: qris-devguard-mcp
  issuer: qris-devguard-local
  default_ttl_minutes: 30
  max_ttl_minutes: 60

search:
  rerank: false              # CPU reranker ~160 s/query (p3 rerank-report); enable only where it is fast
  top_k_default: 5
  top_k_max: 10
  candidate_pool: 20         # hybrid results fetched before the api_family/version post-filter
  query_max_chars: 500
  qdrant_probe_timeout_seconds: 3   # reachability probe before the 60 s client and BGE-M3 load (p5 step 1 finding)
  api_families:              # api_family -> documents it may cite; no filter = all approved documents
    snap: [snap-technical-security-standard, snap-data-technical-spec]
    qris-mpm: [synthetic-qris-mpm-service-spec]

validators:
  fixtures_index: knowledge_base/fixtures/fixtures.yaml
  schemas_dir: knowledge_base/fixtures/schemas
  keys_dir: knowledge_base/fixtures/signatures/keys     # git-ignored; generated by scripts/gen_test_keys.py
  keys_dir_env: DEVGUARD_TEST_KEYS_DIR                   # override (tests, CI)
  rules_version: 0.1.0
  endpoints:
    access-token-b2b:
      api_family: snap
      spec_versions: ["1.0.2"]
      signature_profile: snap-asymmetric-access-token-v1
    qr-mpm-generate:
      api_family: qris-mpm
      spec_versions: ["0.1.0"]
      signature_profile: synthetic-snap-symmetric-v1
    qr-mpm-query:
      api_family: qris-mpm
      spec_versions: ["0.1.0"]
      signature_profile: synthetic-snap-symmetric-v1
  response_code_tables:
    snap:
      "1.0.2":
        path: knowledge_base/sources/derived/snap-response-codes-1.0.2.json   # git-ignored, extracted locally
        document_id: snap-data-technical-spec
        section: "Part 6 Response Code"
        synthetic: false
    qris-mpm:
      "0.1.0":
        path: knowledge_base/fixtures/response_codes/synthetic-qris-mpm-0.1.0.yaml
        document_id: synthetic-qris-mpm-service-spec
        section: "§2 and §3 Response codes"
        synthetic: true
  extract:
    document_id: snap-data-technical-spec
    first_page: 565
    last_page: 570
  max_suggestions: 3
