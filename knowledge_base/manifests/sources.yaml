# Source inventory (Phase P0). Schema: source.schema.json. Check with: uv run python scripts/check_sources.py
#
# Only entries with approval_status: approved may be ingested (P2).
# Promoting an entry to `approved` requires:
#   - a real source_url (no example.* placeholders)
#   - document_version and effective_date
#   - permission.basis other than `unconfirmed`, with evidence
#
# The checksum is filled in at ingestion time. Do not guess versions or dates; leave them null until confirmed.

