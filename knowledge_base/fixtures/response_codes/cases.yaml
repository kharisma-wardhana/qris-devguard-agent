# Response-code lookup cases (p4 spec AC #11).
# `requires_table: true` cases need the locally extracted SNAP table; without it they are reported
# as skipped (never as passed). Expectations hold statuses and code parts only: no ASPI text.
# `table_override: missing` forces the table to be absent, to prove TABLE_UNAVAILABLE.
cases:
