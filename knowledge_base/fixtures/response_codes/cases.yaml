  - { id: rc-mpm-4005102, api_family: qris-mpm, spec_version: "0.1.0", code: "4005102", expect: { status: FOUND, message: "Invalid mandatory field {field name}" } }
  - { id: rc-mpm-4015100, api_family: qris-mpm, spec_version: "0.1.0", code: "4015100", expect: { status: FOUND, message: "Unauthorized: signature invalid" } }
