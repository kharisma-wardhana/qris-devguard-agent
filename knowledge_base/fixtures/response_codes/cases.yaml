  - { id: rc-mpm-unknown-case, api_family: qris-mpm, spec_version: "0.1.0", code: "4004703", expect: { status: NOT_FOUND, suggestions: 2 } }
  - { id: rc-mpm-unknown-status, api_family: qris-mpm, spec_version: "0.1.0", code: "4044700", expect: { status: NOT_FOUND, suggestions: 0 } }
