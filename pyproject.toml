[project]
name = "qris-devguard-ai"
version = "0.1.0"
description = "Self-hosted agentic assistant for diagnosing sandbox QRIS/SNAP API integration issues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "qdrant-client==1.19.1",
    "pdfplumber==0.11.10",
    "mcp==2.3.0",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    "langgraph==1.2.20",
    "fastapi==0.162.2",
    "openai==3.49.0",
]

[project.optional-dependencies]
# Embedding stack for real ingestion/search on the developer machine (CPU only).
# Never installed in CI; tests use a deterministic fake embedder.
embed = [
    "sentence-transformers==6.2.0",
    "torch==2.15.0",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
