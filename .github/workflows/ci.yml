name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/check_sources.py

  # p9 (docs/p9-demo-ui-alerts/plan.md step 9): the Streamlit UI tests need the optional `ui` extra, which the
  # `test` job doesn't install (there they skip). No PostgreSQL in CI: the -m db flows skip with a reason here
  # and are run locally (uv run pytest -m db).
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra ui
      - run: uv run pytest tests/unit/test_ui_app.py tests/unit/test_ui_client.py tests/unit/test_ui_render.py tests/integration/test_ui_e2e.py tests/integration/test_ui_server_cli.py
